[project]
name = "maeen-farmos"
version = "0.5.0"
description = "MAeen FarmOS - vertical slice 1 (water shortage workflow, simulation mode)"
requires-python = ">=3.10"
dependencies = []          # slice 1 is stdlib-only by design

[project.optional-dependencies]
dev = ["pytest>=8", "pglast>=7"]
postgres = ["psycopg[binary]>=3.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pyjwt>=2.7", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
